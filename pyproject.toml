[project]
name = "research-challenge-plugin"
version = "0.1.0"
description = "Structural tests for the research-challenge Claude Code plugin"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"

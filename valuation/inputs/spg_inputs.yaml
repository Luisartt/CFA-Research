# valuation/inputs/spg_inputs.yaml - presentation extras for valuation/build/build_spg_workbooks.py
# (the canonical engine inputs are data/financials.csv, model/drivers.yaml and valuation/valuation.yaml).
# Sources: valuation/inputs/wacc_inputs.yaml/.md (missing-data agent, 2026-10-17), data/adjustments.md,
# the wiki and data/capitaliq/*.csv. Values in MXN millions unless stated. Proposals are tagged assumption.
meta:
  company: "Grupo Bimbo, S.A.B. de C.V."
  ticker: "BMV:BIMBO A"
  valuation_date: "2026-10-16"
  fye: "2025-12-31"
  currency: "MXN"
  units: "millions"

sources_short:
  risk_free: "[calc] Route B (base, proposal): MXN default-free rate 7.5101% = M-Bono 10y 9.26% [sourced] S&P Capital IQ 16-Oct-2026 (data/capitaliq/capiq-ai-model-gaps-2_2026-10-17.md) - Mexico default spread 1.7499% [sourced] Damodaran July 2026 (Baa3). Route A keeps the M-Bono 9.26% with no country premium"
  equity_risk_premium: "[sourced] Damodaran implied ERP 4.20%, 1-Oct-2026 (wacc_inputs G1)"
  country_risk_premium: "[calc] Route B (base, proposal): equity CRP weighted by where Bimbo operates = 2.0496% on FY2025 Adj. EBITDA weights (sales 1.7048%; FY2023-25 EBITDA 1.9900%; FY2023-25 sales 1.6517%; EBITDA weights without Argentina 2.0151%). Country CRPs: Damodaran July 2026 update (Mexico Baa3 2.72%); within regions countries weighted by FY2025 plant counts [assumption: no country sales disclosure]; eliminations attributed to Mexico [assumption]; applied additively (project guide's USD-route formula). Build in BIMBOA_WACC_v3.xlsx"
  beta_unlevered: "[sourced] Damodaran Food Processing, Global, unlevered 0.53, Jan-2026 dataset: betaGlobal.xls 'Industry Averages' B1 'Date updated' = 5-Jan-2026; the HTML page header reads 'Data used is as of January 2026' and its footer 'Last Updated in January 2025' is stale (the file's own history gives 0.536 for the 2025 dataset vs 0.560 now, cash-corrected) (wacc_inputs G6) - proposal; peer 5Y betas too low to use alone"
  target_debt_to_equity: "[calc] Bimbo current market D/E incl. leases 0.743 = (153,660 + 33,361) / 251,684 (wacc_inputs D2) - proposal"
  pre_tax_cost_of_debt: "[calc] M-Bono 10y 9.26% + 0.45pp BIMBO 26 issue spread = 9.71% (wacc_inputs J2-B) - proposal"
  tax_rate: "[sourced] Mexico statutory 30% (wacc_inputs D7)"
  growth: "[assumption] 4.25%: long-run mix of ~36% North America at ~3% in MXN and ~64% Mexico/LatAm/EAA at ~5% (team decision)"
  exit_ev_ebitda: "[assumption] 6.0x: judgment above the core bakery LTM median 5.53x (Flowers 5.61x, Gruma 5.44x; IFRS 16 basis) for the Mexico mix; all eligible peers 8.27x (NTM 8.79x); Bimbo today 6.94x at NCI book (BIMBOA_PeerAnalysis_v3.xlsx) - team decision"
  lt_nominal_gdp_growth: "[assumption] 5.0% = ~2% real + 3% Banxico target. Real growth [sourced]: IMF WEO Oct-2026, Mexico 2.1% a year in 2029-31 (DataMapper NGDP_RPCH, last modified 2026-10-08); Banxico private-sector survey Sep-2026 (published 1-Oct-2026, Cuadro 6 p.8), average 2027-36 mean 1.88% / median 1.80%. Compounded with 3.0% inflation (target; IMF CPI 2029-31 3.0%) the range is 4.85-5.16%; 5.0% is its round midpoint. The 3.0% is the target and the IMF projection, not the survey: the survey's own long-run inflation medians are 3.80% (2027-30) and 3.70% (2031-34) (Cuadro 5 p.6), which would give ~5.6% nominal"
  share_price: "[sourced] BMV official close 16-Oct-2026 MXN 58.60 = PPP (precio promedio ponderado); last trade 58.62, prior close 57.97, change +1.0868% computed on the PPP; volume 3,034,823. BMV 'Estadisticas de operacion', BIMBO serie A, https://www.bmv.com.mx/es/emisoras/estadisticas/BIMBO-5163 (retrieved 2026-10-17). investing.com and Yahoo show the same 58.60 (wacc_inputs A1)"
  non_operating_assets: "[sourced] investments in associates 7,018 at Dec-25 (EEFF25 p.12; results excluded from FCFF)"
  debt_like_items: "[calc] sum of the bridge components below, NCI uplift at the base ke (valuation.md, bridge section)"
  lease_basis: "[calc] published basis: lease liability held at the FY2025 share of revenue (8.15%; FY21-25 6.7-9.2%, mean 8.0%), so new leases = principal + growth in the liability (data/adjustments.md lease table)"

wacc_variants:
  selected_route: 2          # 1 = A local route; 2 = B Damodaran-consistent (v3 base, proposal)
  selected_beta: 3           # 1 bottom-up median; 2 bottom-up mean; 3 industry (Damodaran Global); 4 Bimbo regression
  crp_weight_basis: 1        # route B weights: 1 = FY2025 Adj. EBITDA; 2 = FY2025 sales; 3 = FY2023-25 avg Adj. EBITDA; 4 = FY2023-25 avg sales

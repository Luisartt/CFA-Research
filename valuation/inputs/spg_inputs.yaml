  one_off_in_fy26: {value: 1.0, tag: assumption, source: "1 = the FY2026E forecast includes the gain (the 14.7% FY2026 margin proposal follows guidance raised after 1Q26, which contained it); the FY2026E FCFF is then put on the same basis before 2H26 is derived. Set 0 if the forecast excludes it"}
  da_1h: {value: 12125.1, tag: sourced, source: "D&A total 1Q26 6,028.4 + 2Q26 6,096.7, CIQ quarterly cash flow (CIQ D&A runs ~3% below the filing basis)"}
  capex_1h: {value: 6942.0, tag: sourced, source: "PP&E 6,892 + intangibles 50, BMV Jun-26 p.17-18 (wiki bimbo-cash-flow-and-fcf)"}
  lease_1h: {value: 2906.39, tag: calc, source: "Lease payments 3,948.42 less lease interest accrued 1,042.03, 1H26 lease roll-forward (BMV 2Q26 XBRL p.100; payments = cash flow 688.02 + 3,260.40, p.18). Same basis as data/financials.csv: the cash split of interest is not disclosed (data/adjustments.md adjustment 6)"}
  dnwc_1h: {value: -2009.0, tag: calc, source: "Operating basis, cash-flow sign, Dec-25 to Jun-26 CIQ balance sheets (data/capitaliq/balance_sheet.csv): trade receivables +772, other and notes receivable +214, inventory -44, other current assets +1,833, accounts payable -830, accrued expenses +1,816, other current liabilities -220 = -2,009. Income taxes payable (+4,538, seasonal) excluded, as in the DCF, and deducted below as a June claim. June splits of other current assets and accruals are not disclosed, so they are treated as operating [assumption]. CIQ cash-flow basis -2,528 (memo). Codex re-check 2026-10-17"}
  tax_seasonal_jun: {value: 4538.05, tag: calc, source: "Income taxes payable 5,597.05 (Jun-26) less 1,059.0 (Dec-25), CIQ balance sheet: taxes accrued on 1H26 profits and paid in 2H26. The Dec-25 level stays in the flat non-operating float, as in the DCF. Deducted in both methods because it lifts June cash"}
  debt_jun: {value: 153660.0, tag: sourced, source: "Total financial debt 30-Jun-2026 (BMV Jun-26 debt note; 2Q26 release p.6)"}
  leases_jun: {value: 33361.0, tag: sourced, source: "Lease liabilities 7,113 + 26,248, CIQ balance sheet 2026 FQ2"}
  cash_jun: {value: 16563.0, tag: sourced, source: "Cash and equivalents 30-Jun-2026 (CIQ; net debt 137,097 per 2Q26 release p.6)"}
  nci_jun: {value: 721.7, tag: sourced, source: "Total minority interest 30-Jun-2026, CIQ balance sheet"}
  debt_like_jun_ex_nci: {value: 18135.0, tag: calc, source: "Same policy as Dec-25, 30-Jun-2026 (BMV 2Q26 XBRL, filings/bmv/Reporte_Definitivo_BMV_XBRL_Español_Jun_26.pdf): employee benefits line 6,202 [sourced] p.13 x the Dec-25 net after-tax ratio 0.6899 (4,489.35 / 6,507) = 4,278.92; provisions 11,029.37 [sourced] p.59 = uncertain tax positions 8,692.48 + tax 1,318.41 (no shield) + labour 511.64 and civil 506.26 x 0.70 + other 0.58 = 10,724.00; net derivative liabilities 1,864.18 [sourced] p.64-65 = liabilities 978.28 + 2,658.38 less assets 784.79 + 987.70; MEPP 632.56 and deferred compensation 635.34 after tax. MEPP and deferred compensation are not disclosed separately at Jun-26: the 'other long-term provisions' line is 13,011.49 (p.13), which leaves 1,982.12 beyond provisions (2,314.86 at Dec-25 for MEPP 985 + deferred compensation 1,060 + other 270), split in the Dec-25 proportions [assumption]: MEPP 843.41 x 0.75, deferred compensation 907.63 x 0.70. Was 19,343.67 with Dec-25 values carried. The NCI claim is added live (market value less June book)"}
  non_op_jun: {value: 6497.5, tag: sourced, source: "Equity-method investments 30-Jun-2026, CIQ balance sheet"}
  days_roll: {value: 108.0, tag: calc, source: "30-Jun-2026 to 16-Oct-2026"}
  dist_after: {value: 76.0, tag: unverified, source: "July 2026 buybacks of 1,340,500 shares at ~MXN 57 (no cash disclosed); dividend paid 13-May-2026, before 30-Jun"}
  shares_out: {value: 4294.943715, tag: sourced, source: "Shares outstanding 29-Jul-2026, BMV notice (wacc_inputs A8)"}
  reconciliation_notes:
    - "The engine rolls Dec-25 equity forward at the cost of equity; the dated check starts from the 30-Jun-2026 balance sheet, which already reflects the 13-May-2026 dividend (MXN 4,627m) and 1H26 buybacks (MXN 496m)."
    - "Net debt ex-IFRS 16 fell from 145,128 (Dec-25) to 137,097 (Jun-26), helped by peso strength on USD debt and 1H26 cash generation."
    - "Still an approximation: the roll from 30-Jun to 16-Oct uses the cost of equity, not an observed October balance sheet."


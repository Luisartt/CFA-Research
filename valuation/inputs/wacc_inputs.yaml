e_bimbo_s_own_beta:
  title: Bimbo's own beta
  items:
  - id: E1
    label: Regression beta (5Y monthly vs IPC, or any window)
    value: not computed
    unit: text
    tag: unverified
    source: Monthly history for BIMBOA.MX returned only 13 closes (Nov-2025 to Oct-2026) [WEB-YHH]; IPC (^MXX) 13 monthly closes [WEB-YHX]; investing.com snapshot covered June-July only
    as_of: '2026-10-16'
    note: A 5-year monthly regression needs 60 returns. No return series in data/capitaliq. Not computed; one attempt only, per instruction.
  - id: E2
    label: Published Bimbo beta (investing.com overview)
    value: 0.32
    unit: x (levered, raw)
    tag: unverified
    source: investing.com BIMBOA overview, 'Beta' field 0.32 [WEB-INVB]; FAQ 'As of Oct 17, 2026'; price header 'Closed 16/10'
    as_of: '2026-10-16'
    note: Window and benchmark not printed; date of the beta not explicit. Yahoo shows '--' [WEB-YHK]. Used only as option C, which is not a verified regression.
  - id: E3
    label: Beta used for Bimbo in the WACC candidates
    value: derived from peers and industry (section H, I, K)
    unit: text
    tag: assumption
    source: Options A and B in section K
    as_of: '2026-10-16'
  - id: E4
    label: Blume-adjusted Bimbo beta (0.67 x raw + 0.33)
    value: 0.5444
    unit: x
    tag: calc
    source: E2 (raw published beta)
    as_of: '2026-10-16'
    formula: 0.67 x E2 + 0.33
    note: Used in the sensitivities of K2 (option C, Blume).

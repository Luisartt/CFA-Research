# valuation/inputs/wacc_inputs.yaml - draft v1 (2026-10-17). Built from one Python dict that also writes wacc_inputs.md.
# Every value carries tag, source and as_of. Calc items carry their formula. Proposals for the team, not decisions.
meta:
  title: WACC inputs - Grupo Bimbo (BIMBOA), valuation date 2026-10-16
  version: draft v1
  prepared: 2026-10-17 (missing-data agent)
  currency: MXN (local route); US$ shown for peers
  routes:
    L: 'local MXN: rf = M-Bono 10y, CRP 0'
    D: 'Damodaran-consistent: rf = M-Bono 10y - Mexico default spread; ERP + lambda CRP'
  status: proposals for the team; not decisions
  tags:
  - sourced
  - guidance
  - assumption
  - calc
  - unverified

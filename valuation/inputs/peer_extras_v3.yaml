judgment_calls:
- Gruma EBITDA basis = company (UAFIRDA), not Capital IQ's. The test uses margins, which do not depend on FX. Consensus EBITDA margin is 16.7% FY26E, 16.4% FY27E and 16.6% FY28E; company-basis margins are 17.4% FY24, 17.8% FY25, 17.1% LTM and 16.4% in 1H26. On the company basis FY26E implies 2H26 EBITDA 572.9 on revenue 3,373.7 (17.0% vs 17.7% in 2H25), a plausible continuation of the 1H26 compression. On the CIQ basis (FY25 1,033.5, LTM 995.0, margin 15.3%) FY26E would be +7.5% on FY25 and +11.7% on LTM while CIQ LTM EBITDA is falling and revenue grows about 4%, which needs a 2H26 jump of about 20%. So NTM (consensus) and LTM (1,108.9) are on one basis.
- 'Gruma consensus FX translation: Capital IQ says the estimates are MXN converted at the query-date spot. Bimbo''s MXN consensus (consensus.csv) against the prompt-7 USD values implies 17.46 for FY1 and 18.50 / 18.51 for FY2 / FY3, and Gruma''s FY27E fall (-3.1% revenue, -4.7% EBITDA, -5.0% EPS) fits the same pattern. CIQ''s USD values are used as given, as for every other peer. If FY2 were rebased to the FY1 rate (x1.0598): Gruma NTM 5.39x (vs 5.64x), core NTM median 5.77x (vs 5.89x), Gruma P/E NTM 9.31x; the all-peer NTM EV and P/E medians do not move.'
- 'P/E eligibility follows the rule as applied in v1/v2: ''peers without a reconciled basis are shown but excluded from medians'' (Detail A4), and every in_median_pe = yes also has in_median = yes; P/E further needs available, non-depressed earnings (Smucker out at 58.6x). Alternative reading (P/E independent of the lease/NCI basis, adding the CIQ-tool P/Es of YMZ, ARYN and AC): P/E LTM median 16.95x and NTM 13.62x (n=8).'
- 'ARYZTA NCI: kept the v2 CIQ TEV residual (-17.4) in ARYN.nci_book rather than a zero or a blank. A blank counts as 0 in L15 (EV 2,120.7, 8.40x); the text ''n/a'' would turn the EV into n/a. The EUR check leaves the residual out: the gap between 8.33x (USD workbook) and 8.59x (EUR) is +0.07x from the residual and +0.19x from FX (EBITDA and balance sheet at CIQ''s 1.166559 vs market cap at 1.1213).'
- 'Local-currency multiples: the workbook keeps Capital IQ''s USD conversions for the non-USD reporters (balance sheet and EBITDA at CIQ''s 30-Jun/LTM rates, market cap at the 16-Oct rate). Cross-check: market cap from the CIQ chart USD price at the 16-Oct rate, debt, cash and EBITDA in local currency, NCI excluded. YMZ 6.23x JPY vs 6.06x USD; ARYN 8.59x EUR vs 8.33x USD; AC 8.06x MXN (MXN price 209.66) vs 7.85x USD. If any of them becomes eligible, use the local-currency multiple.'
- 'Arca omitted claims [calc]: CIQ tool 8.47x x LTM EBITDA MXN 48,607m = EV MXN 411,701m vs our EV ex-NCI 391,808m (market cap 355,625 + CIQ net debt 36,183), so the tool carries about MXN 19,893m (USD 1,077m, 5.1% of EV) of claims our EV lacks, consistent with a material NCI. Rounding of 8.47 moves this by +/-243; on the 15-Oct close (206.85) it would be about 24,659. The tool''s basis differs from table EVs for six peers (wiki discrepancy #7), so the figure is indicative only.'
- 'Gruma shares: kept 336.207985m (30-Jun-2026 filing, = CIQ basic 336.2 in prompt 4, same date as the balance sheet). Prompt 5''s latest 332.6m (CIQ market cap 4,355.1) would give EV/EBITDA LTM 5.40x (vs 5.44x) and a core LTM median of 5.504x (vs 5.526x).'
- PEP market cap kept at 179,200.5 (prompt 1). Prompt 5's 179,186.8 fits the 16-Oct chart close 131.49 slightly better but differs by -0.008% (-0.0007x). FLO, SJM, CPB, MDLZ and ARYN market caps are identical in prompts 1 and 5.
- 'Gross profit LTM moved to the CIQ basis for CPB and PEP (alternative: keep the SEC calculations 2,742 and 53,216). Gruma (company 2,522.2 vs CIQ 2,522.1) and Mondelez (12,357 in both) are unchanged in the Inputs; template gp_ltm lists the CIQ values for all nine.'
- 'ARYZTA DPS LTM, FY2024 and FY2025 set to 0.0 (CIQ: does not pay a dividend; FY2026E consensus 0.00) rather than null.'
- SJM and CPB DPS FY2024 / FY2025 use the table values (SJM 4.24 / 4.32 for the years to April 2024 / 2025; CPB 1.48 / 1.54 for the years to August 2024 / 2025). The prompt-5 note says the FY2026 values (SJM 4.40, CPB 1.56) sit in the FY2025 column, but the table does not show them; labels follow the revenue columns (SJM FY2025 revenue 8,726.1 = year to April 2025).

  px_dates: data/capitaliq/capiq-ai-model-gaps-5_2026-10-17.md chart table (month-end USD closes; 16-Oct-2026 = pricing date; QTD base 30-Sep-2026, YTD base 31-Dec-2025, 1Y-5Y month-end bases).
  px: data/capitaliq/capiq-ai-model-gaps-5_2026-10-17.md chart table, columns NYSE:FLO, BMV:GRUMA B, TSE:2212, SWX:ARYN, NYSE:SJM, NASDAQGS:CPB, NASDAQGS:MDLZ, BMV:AC (Arca's own series) and NASDAQGS:PEP (USD).
  px_bimbo_mxn: data/market/bimbo_ipc_monthly_2021-11_2026-10.csv column bimbo_close_mxn, rows 2026-10-16, 2026-09, 2025-12, 2025-10, 2024-10 and 2023-10; 29-Oct-2021 = 60.94 from data/capitaliq/capiq-ai-model-gaps-1_2026-10-17.md Task 1B.
  dps_ltm: data/capitaliq/capiq-ai-model-gaps-5_2026-10-17.md market data table, row 'DPS - Last 12 Months (USD)' (LTM end dates in its LTM table). ARYN N/A = no dividend per its Items Not Retrieved note (0.0).
  dps_fy24: data/capitaliq/capiq-ai-model-gaps-5_2026-10-17.md market data table, row 'DPS - FY2024 (USD)'. ARYN 0.0 (no dividend).
  dps_fy25: data/capitaliq/capiq-ai-model-gaps-5_2026-10-17.md market data table, row 'DPS - FY2025 (USD)'. ARYN 0.0 (no dividend). The note saying SJM 4.40 and CPB 1.56 sit in this column contradicts the table (4.32, 1.54).
  gp: 'data/capitaliq/capiq-ai-model-gaps-6_2026-10-17.md Task 6A, columns FY2024 and FY2025 (USD m; fiscal years: SJM April, CPB about August, others December).'
  gp_ltm: data/capitaliq/capiq-ai-model-gaps-6_2026-10-17.md Task 6A, column LTM Gross Profit (end dates per table). Inputs take these for all peers except GRUMA (company 2,522.2) and MDLZ (equal).
  gm_cons: data/capitaliq/capiq-ai-model-gaps-6_2026-10-17.md Task 6B, Gross Margin % mean consensus FY1-FY3 (in %).
  fcf_cons: data/capitaliq/capiq-ai-model-gaps-6_2026-10-17.md Task 6B, Free Cash Flow mean consensus FY1-FY3 (USD m).
  dps_cons: data/capitaliq/capiq-ai-model-gaps-6_2026-10-17.md Task 6B, Dividends Per Share mean consensus FY1-FY3 (USD).
  capex_cons: data/capitaliq/capiq-ai-model-gaps-7_2026-10-17.md Task 7B, consensus mean capital expenditures FY1-FY3 (USD m), incl. Grupo Bimbo.
  rev_cons: data/capitaliq/capiq-ai-model-gaps-7_2026-10-17.md Task 7B, consensus mean revenue FY1-FY3 (USD m), incl. Grupo Bimbo.
  fy_labels: data/capitaliq/capiq-ai-model-gaps-6_2026-10-17.md Task 6B and data/capitaliq/capiq-ai-model-gaps-7_2026-10-17.md Task 7B fiscal-year mapping (SJM FY1 = year to 30-Apr-2027; CPB FY1 = year to 31-Jul-2027).
  gruma: data/capitaliq/capiq-ai-model-gaps-4_2026-10-17.md Task 4C (EBITDA, revenue and EPS normalized consensus means FY2026E-FY2028E) and Task 4B (diluted EPS LTM 1.40). Basis = company (UAFIRDA); see judgment_calls.

eligibility:
- key: FLO
  in_median: 'yes'
  in_median_pe: 'yes'
  changed_vs_v2: false
  note: 'US GAAP, lease basis reconciled: CIQ total debt 2,007.8 vs financial debt 1,686.2 + operating leases 317.1 (-0.2%); EBITDA + LTM operating lease cost 91.8; NCI nil (filings). P/E available (23.45x / 8.93x) and not distorted. Unchanged.'
- key: GRUMA
  in_median: 'yes'
  in_median_pe: 'yes'
  changed_vs_v2: true
  note: 'IFRS 16, USD statements: debt + IFRS 16 leases reconcile to CIQ total debt 2,111.8; EBITDA before lease costs (company UAFIRDA); NCI 2.8 from filings. Consensus FY2026E-FY2028E is now available on the same company basis (FY26E 1,111.37 vs LTM 1,108.9), so Gruma enters the NTM medians. P/E now available: price USD 13.10 / diluted EPS LTM 1.40 = 9.36x, NTM 9.74x; earnings not depressed, so P/E-eligible (it was ''no'' only for lack of data).'
- key: YMZ
  in_median: 'no'
  in_median_pe: 'no'
  changed_vs_v2: false
  note: 'Fails the lease test. Under J-GAAP operating leases are off balance sheet (CIQ''s JPY 7,853m are finance-lease obligations) and no operating lease cost is available to add back, so EBITDA is after operating lease costs: neither ''debt includes leases'' nor ''EBITDA before lease costs'' holds. NCI not returned (CIQ N/A). Peers without a reconciled basis are excluded from all medians, P/E included. Unchanged.'
- key: ARYN
  in_median: 'no'
  in_median_pe: 'no'
  changed_vs_v2: false
  note: 'Lease basis now passes: CIQ total debt EUR 845.9m = long-term debt 678.2 + IFRS 16 leases 167.8 (35.5 + 132.3); IFRS 16 EBITDA is before lease costs; shares 24.8m in three CIQ pulls. Fails the claim basis on NCI: Capital IQ returns minority interest as N/A for every company, including CPB (306), MDLZ (53), PEP (195) and Gruma (2.8), whose filings show NCI, so N/A is not zero, and the CIQ TEV residual (-17.4) is unexplained. NCI not verified, so excluded from all medians. Unchanged.'
- key: SJM
  in_median: 'yes'
  in_median_pe: 'no'
  changed_vs_v2: false
  note: 'US GAAP, lease basis reconciled (exact tie incl. finance leases 9.6); EBITDA + operating lease cost 46.9; in EV medians. P/E excluded: LTM 58.6x reflects depressed earnings [assumption]. Unchanged.'
- key: CPB
  in_median: 'yes'
  in_median_pe: 'yes'
  changed_vs_v2: false
  note: US GAAP, lease basis reconciled (exact tie); EBITDA + operating lease cost 114.0; EV includes redeemable NCI 304 and NCI 2. P/E 15.11x / 11.72x. Unchanged.
- key: MDLZ
  in_median: 'yes'
  in_median_pe: 'yes'
  changed_vs_v2: false
  note: US GAAP, lease basis reconciled on noncurrent leases (exact tie) + current leases 164 (Dec-25 proxy) [assumption]; EBITDA + FY25 operating lease cost 246 [assumption]; NCI 53. P/E 23.1x / 19.8x. Unchanged.
- key: AC
  in_median: 'no'
  in_median_pe: 'no'
  changed_vs_v2: false
  note: 'Lease basis now passes: CIQ total debt MXN 65,427m includes IFRS 16 leases 1,832.2 (reconciles within 3.7 once two derivation slips in the output are corrected); IFRS 16 EBITDA; shares 1,696.2m; price corroborated by the CIQ chart. Fails the claim basis on NCI: CIQ N/A, and the CIQ tool''s 8.47x vs 8.06x ex-NCI implies about MXN 19.9bn of claims missing from our EV, consistent with a material NCI. Excluded from all medians. Unchanged.'
- key: PEP
  in_median: 'yes'
  in_median_pe: 'yes'
  changed_vs_v2: false
  note: 'US GAAP: CIQ debt excludes operating leases, so EV adds 3,846 (27-Dec-2025 10-K) [assumption]; EBITDA + FY25 operating lease cost 880 [assumption]; NCI 195. P/E 16.15x / 15.53x. Unchanged.'

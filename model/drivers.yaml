# model/drivers.yaml - written by the forecast skill workflow (assistant proposal), read by the model engine.
# One value per forecast year (FY2026E-FY2035E): FY2026-FY2030 explicit, FY2031-FY2035 fade to steady state.
# tag: guidance | assumption | sourced.  pillar: team thesis pillars as of 2026-10-16 -
#   "1" = climate (input costs / wheat), "2" = new CEO (productivity, execution), "3" = debt management (hold).
# STORY DRIVERS ARE PROPOSALS ONLY: segment growth, gross_margin, opex_pct_revenue and capex_pct_revenue must be
# confirmed or changed by the team (AGENTS.md: the team decides the 3-5 assumptions that carry the story).
# Until the team sets its variant view, this forecast is close to guidance/consensus for FY2026 and to a neutral
# fade afterwards.
forecast_years: 10
revenue_segments:
  - {key: north_america, label: North America}
  - {key: mexico, label: Mexico}
  - {key: europe_asia_africa, label: "Europe, Asia & Africa"}
  - {key: latin_america, label: Latin America}
  - {key: eliminations, label: Inter-regional eliminations}

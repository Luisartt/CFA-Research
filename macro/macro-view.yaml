# macro-view.yaml — house view macro COMPARTIDO por toda la cobertura
# Vive en <raiz>/macro/macro-view.yaml (nombre fijo — lo consume código), FUERA de las carpetas por emisora.
# Lo llena el analista. El plugin lo PROPONE desde macro/sources/ y macro/series/ (/update-macro): cada valor
# lo confirma el analista; el plugin jamás lo decide.
# Snapshot previo: macro/history/macro-view_2026-10-17.yaml (plantilla vacía: es la primera actualización).
#
# 2026-10-17 — primera carga por /research-analyst:update-macro, en modo automático (el equipo pidió no ser
# consultado durante la corrida). Por eso cada campo lleva status: propuesto. Solo se cargaron datos OBSERVADOS
# con cita (filings, Capital IQ, Banxico, FMI, Damodaran) y un cálculo sobre datos observados; ningún supuesto.
# Pendiente del equipo: confirmar, corregir o rechazar campo por campo (BIMBOA/journal/decisions.md, 2026-10-17).
# FRED no se corrió: falta la API key gratuita (ver macro/series/README.md).
# Etiquetas: observado / guidance / supuesto / output (research-analyst) y, en la fuente, la etiqueta del
# proyecto ([sourced] / [calc]).

